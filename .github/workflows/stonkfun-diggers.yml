name: stonkfun-diggers
on:
  workflow_dispatch:
    inputs:
      token_cap:
        description: Max winners to process
        default: "12"
      peak_min:
        description: Min peak mcap USD
        default: "40000"
  schedule:
    # Optional low-frequency; box daemon is primary (STONKFUN_EVERY_SEC)
    - cron: "20 */6 * * *"
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hunt diggers
        env:
          LIVE_TRADING: "0"
          GMGN_DISABLED: "1"
          STONK_ONCE: "1"
          STONK_TOKEN_CAP: ${{ github.event.inputs.token_cap || '12' }}
          STONK_PEAK_MIN_USD: ${{ github.event.inputs.peak_min || '40000' }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL || 'https://solana-rpc.publicnode.com' }}
        run: python3 scripts/hunt_stonkfun_diggers.py --once
      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sol-wallets/stonkfun_diggers.jsonl sol-wallets/summary_stonkfun_diggers.md sol-wallets/raw/stonkfun_hunt_state.json || true
          if git status --porcelain sol-wallets/ | grep -q .; then
            git commit -m "chore(sol): stonkfun digger hunt (gha)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "no changes"
          fi
