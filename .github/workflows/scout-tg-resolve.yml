name: scout-tg-resolve

# Chunked Blockscout resolve: bs_all walks unresolved tokens but only
# fetch/deepens SCOUT_TG_BS_TOKEN_CAP per run (default 80) within
# SCOUT_TG_BS_TIME_BUDGET_SEC (default 1500). Re-dispatch until unique% climbs.
# pages=0 = resolve-only from disk (no TG scrape). MEGA_UNION stays on.

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "TG scrape pages (0=resolve-only from disk)"
        required: false
        default: "0"
      bs_pages:
        description: "Blockscout page depth per token"
        required: false
        default: "50"
      vet_cap:
        description: "GMGN traders call cap (stop on 429)"
        required: false
        default: "0"
      max_tokens:
        description: "GMGN max tokens"
        required: false
        default: "80"
      bs_all:
        description: "Walk ALL unresolved tokens (still respects bs_token_cap/time_budget)"
        required: false
        default: "1"
      bs_token_cap:
        description: "Max BS fetch/deepen tokens this run (default 80; -1=unlimited)"
        required: false
        default: "80"
      time_budget:
        description: "Stop NEW BS fetches after N seconds (default 1500; 0=off)"
        required: false
        default: "1500"

permissions:
  contents: write
  actions: read

concurrency:
  # share with gmgn-vet-throttle so portfolio + traders never overlap
  group: gmgn-gha
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install gmgn-cli
        run: npm install -g gmgn-cli

      - name: Configure GMGN env (no echo)
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY_GHA || secrets.GMGN_API_KEY }}
          GMGN_DISABLED: "0"
        run: |
          mkdir -p "$HOME/.config/gmgn"
          python3 -c 'import os,pathlib; k=os.environ.get("GMGN_API_KEY",""); p=pathlib.Path.home()/".config/gmgn/.env"; p.write_text("GMGN_API_KEY="+k+"\n"); p.chmod(0o600); print("gmgn_dotenv=ok" if k else "gmgn_dotenv=missing")'

      - name: Deep scrape + resolve ALL unresolved truncs
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY_GHA || secrets.GMGN_API_KEY }}
          GMGN_DISABLED: "0"
          SCOUT_TG_ENABLED: "1"
          SCOUT_TG_PAGES: ${{ inputs.pages || '90' }}
          SCOUT_TG_RESOLVE: "1"
          SCOUT_TG_VET_CAP: ${{ inputs.vet_cap || '120' }}
          SCOUT_TG_MAX_TOKENS: ${{ inputs.max_tokens || '80' }}
          SCOUT_TG_BS_PAGES: ${{ inputs.bs_pages || '40' }}
          SCOUT_TG_BS_ALL: ${{ inputs.bs_all || '1' }}
          SCOUT_TG_BS_TOKEN_CAP: ${{ inputs.bs_token_cap || '80' }}
          SCOUT_TG_BS_TIME_BUDGET_SEC: ${{ inputs.time_budget || '1500' }}
          SCOUT_TG_BLOCKSCOUT: "1"
          SCOUT_TG_MULTI_UNION: "1"
          SCOUT_TG_MEGA_UNION: "1"
          SCOUT_TG_BS_DEEPEN_MISS: "1"
          SCOUT_TG_BS_DEEPEN_PLATEAU_MIN: "120"
          SCOUT_TG_BS_REDeepEN: "1"
          SCOUT_TG_BS_REDeepEN_BELOW: "500"
          SCOUT_TG_BS_ES_ALWAYS: "1"
          SCOUT_TG_BS_ES_OFFSET: "500"
          SCOUT_TG_GECKO: "1"
          SCOUT_TG_GECKO_PAGES: "4"
          SCOUT_TG_NEIGHBOR_CA: "1"
          SCOUT_TG_NEIGHBOR_MSG_WINDOW: "120"
          SCOUT_TG_BS_SLEEP_MS: "600"
          SCOUT_TG_SKIP_WELL_RESOLVED: "0.95"
          SCOUT_TG_BS_REUSE_MIN: "60"
          SCOUT_TG_BS_429_PAUSE: "30"
          SCOUT_TG_BS_COOLDOWN_WAIT: "120"
          CHAIN: robinhood
          WATCHLIST_PATH: rh-wallets/wallets.jsonl
        run: python3 scripts/harvest_scout_telegram.py

      - name: Rank scout wallets + promote
        env:
          SCOUT_RANK_MERGE: "1"
          SCOUT_MERGE_ALL_RESOLVED: "1"
          SCOUT_TG_VET_CAP: "0"
          GMGN_DISABLED: "1"
          CHAIN: robinhood
          WATCHLIST_PATH: rh-wallets/wallets.jsonl
          # Signal notify already DROP_WEAK=0 / REQUIRE_CONSISTENT_PNL=0 / ALLOW_FOMO_WITHOUT_WR=1
          # Promote every uniquely-resolved scout addr (not elite-only).
          REQUIRE_CONSISTENT_PNL: "0"
          ALLOW_FOMO_WITHOUT_WR: "1"
          WATCH_MIN_WINRATE: "0.40"
          WATCH_MIN_TRADES: "10"
          WATCH_MIN_AVG_PNL_PER_TRADE: "30"
          WATCH_MIN_REALIZED_HARD: "100"
        run: python3 scripts/rank_scout_wallets.py
        continue-on-error: true

      - name: Commit resolve artifacts
        continue-on-error: true
        run: |
          git config user.name "meme-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            rh-wallets/wallets.jsonl \
            rh-wallets/wallets_scout_ranked.jsonl \
            rh-wallets/summary_scout.md \
            rh-wallets/summary_scout_resolve.md \
            rh-wallets/raw/scout_tg_*.jsonl \
            scripts/harvest_scout_telegram.py \
            .github/workflows/scout-tg-resolve.yml || true
          if git diff --cached --quiet; then
            echo "no resolve changes"
          else
            git commit -m "chore: scout TG deep resolve (unique-match)"
            if ! git pull --rebase origin main; then
              echo "rebase conflict — prefer GHA resolve artifacts"
              for f in rh-wallets/wallets.jsonl rh-wallets/wallets_scout_ranked.jsonl rh-wallets/summary_scout.md rh-wallets/summary_scout_resolve.md; do
                if [ -f "$f" ] && git status --porcelain "$f" | grep -q .; then
                  git checkout --theirs -- "$f" || true
                  git add "$f" || true
                fi
              done
              git add rh-wallets/raw/ || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            git push || git push --rebase origin main || true
          fi

      - name: Upload resolve artifact
        uses: actions/upload-artifact@v4
        with:
          name: scout-tg-resolve
          path: |
            rh-wallets/wallets.jsonl
            rh-wallets/wallets_scout_ranked.jsonl
            rh-wallets/summary_scout.md
            rh-wallets/summary_scout_resolve.md
            rh-wallets/raw/scout_tg_*.jsonl
          if-no-files-found: warn
