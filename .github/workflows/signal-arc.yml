name: meme-signal-arc

on:
  schedule:
    # Offset vs RH (:0/:5) so free kickers don't stampede. GitHub schedule often skips — cron-job.org also kicks.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch: {}

concurrency:
  # Queue instead of cancel — 5m kickers were aborting ~6m runs → zero buy notifies.
  group: meme-signal-arc
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log trigger
        run: |
          echo "event=${{ github.event_name }}"
          echo "run_id=${{ github.run_id }}"
          date -u +'utc=%Y-%m-%dT%H:%M:%SZ'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install gmgn-cli
        run: npm install -g gmgn-cli@1.6.4

      - name: Configure GMGN env (no echo)
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY_GHA || secrets.GMGN_API_KEY }}
          GMGN_DISABLED: "0"
        run: |
          mkdir -p "$HOME/.config/gmgn"
          python3 -c 'import os,pathlib; k=os.environ.get("GMGN_API_KEY",""); p=pathlib.Path.home()/".config/gmgn/.env"; p.write_text("GMGN_API_KEY="+k+"\n"); p.chmod(0o600); print("gmgn_dotenv=ok" if k else "gmgn_dotenv=missing")'

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: |
            state-arc.json
            paper_log_arc.jsonl
            paper_book_arc.jsonl
            paper_summary_arc.md
            live_state_arc.json
            live_book_arc.jsonl
          key: meme-signal-arc-state-v2-${{ github.run_id }}
          restore-keys: |
            meme-signal-arc-state-v2-
            meme-signal-arc-state-

      - name: Resolve Arc watchlist path
        id: wl
        run: |
          if [ -f arc-wallets/wallets_quality.jsonl ]; then
            echo "path=arc-wallets/wallets_quality.jsonl" >> "$GITHUB_OUTPUT"
          else
            echo "path=arc-wallets/wallets.jsonl" >> "$GITHUB_OUTPUT"
          fi

      - name: Run once (Arc signals + paper + live)
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY_GHA || secrets.GMGN_API_KEY }}
          GMGN_DISABLED: "0"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_ARC_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ARC_WEBHOOK_URL: ${{ secrets.DISCORD_ARC_WEBHOOK_URL }}
          DISCORD_PAPER_WEBHOOK_URL: ${{ secrets.DISCORD_PAPER_WEBHOOK_URL }}
          DISCORD_ARC_PAPER: ${{ secrets.DISCORD_ARC_PAPER }}
          DISCORD_ARC_LIVE_WEBHOOK_URL: ${{ secrets.DISCORD_ARC_LIVE_WEBHOOK_URL }}
          NANSEN_FOR_TRADES: "0"
          FOMO_ENABLED: "0"
          XBTSCOUT_ENABLED: "0"
          LIVE_TRADING: "0"
          LIVE_CHAINS: "arc"
          LIVE_WALLET_ADDRESS: "0x822AFdCc7f1Ec829f4456A3921ff54B4a6dBCfAe"
          LIVE_BANKROLL_USD: "80"
          LIVE_MAX_OPEN: "5"
          LIVE_MAX_ENTRIES_WEEK: "0"
          LIVE_MAX_LOSSES_WEEK: "0"
          LIVE_ONE_PER_CHAIN: "0"
          LIVE_STATE_PATH: live_state_arc.json
          LIVE_BOOK_PATH: live_book_arc.jsonl
          GMGN_ALLOW_AUTOMATED_TRADES: "1"
          ALLOW_GMGN_CLUSTER: "0"
          PAPER_BANKROLL_USD: "300"
          PAPER_TRADING: "0"
          PAPER_ONE_PER_CHAIN: "0"
          PAPER_MAX_OPEN: "5"
          PAPER_MAX_ENTRIES_WEEK: "0"
          PAPER_MAX_LOSSES_WEEK: "0"
          PAPER_MARK_HEARTBEAT: "0"
          MIN_TOKEN_AGE_SEC: "900"
          MAX_TOKEN_AGE_SEC: "604800"
          PLAYBOOK_REQUIRED: "1"
          SET1_MIN_AGE_SEC: "1800"
          SET1_MAX_AGE_SEC: "172800"
          SET2_MIN_AGE_SEC: "172800"
          SET2_MAX_AGE_SEC: "604800"
          SET1_MIN_PUMP_PCT: "40"
          SET1_CORR_M5_MAX: "25"
          SET2_MIN_DUMP_PCT: "-50"
          SET2_MAX_M5_ABS: "10"
          SET2_MAX_H1_ABS: "30"
          SET2_MIN_VOLUME_H24: "8000"
          CHAIN: arc
          ARC_SKIP_SECURITY_AUDIT: "1"
          WINDOW_SECONDS: "900"
          MIN_WALLETS: "2"
          MIN_TRADE_USD: "80"
          MIN_CLUSTER_USD: "200"
          MIN_VOLUME_H24_USD: "8000"
          VOLUME_REQUIRED: "1"
          MIN_VOLUME_M5_USD: "800"
          VOLUME_M5_REQUIRED: "1"
          REQUIRE_GRADUATED: "0"
          ALLOW_PRE_GRAD: "1"
          PRE_GRAD_MIN_VOLUME_M5: "800"
          REQUIRE_BUY_INCREASE: "1"
          BUY_VOLUME_REQUIRED: "1"
          MIN_BUY_VOLUME_M5_USD: "500"
          MIN_BUYS_M5: "8"
          DROP_WEAK_WALLETS: "1"
          WEAK_WALLET_MAX_SCORE: "0.5"
          WATCH_MIN_REALIZED_HARD: "500"
          REQUIRE_CONSISTENT_PNL: "1"
          WATCH_MIN_PROFIT_TOKENS: "3"
          WATCH_MIN_EARLY2X_TOKENS: "2"
          WATCH_MIN_WINRATE: "0.45"
          WATCH_MIN_TRADES: "15"
          WATCH_MIN_AVG_PNL_PER_TRADE: "50"
          ALLOW_FOMO_WITHOUT_WR: "0"
          MIN_M5_SELL_RATIO: "0"
          MIN_ABS_PRICE_CHANGE_M5: "3"
          REQUIRE_PRICE_MOVE: "1"
          MIN_ABS_PRICE_MOVE_H1: "5"
          MIN_GRAD_LIQ_USD: "2500"
          MAX_PRICE_CHANGE_M5_PCT: "60"
          MAX_PRICE_CHANGE_H1_PCT: "250"
          MAX_M5_BUY_RATIO: "0.92"
          DROP_BOT_WALLETS: "1"
          EXCLUDE_FRESH_WALLET_ONLY: "0"
          MIN_HOLDERS: "80"
          HOLDERS_REQUIRED: "0"
          MIN_WALLET_QUALITY: "1.0"
          REQUIRE_WALLET_QUALITY: "1"
          MIN_AVG_WALLET_QUALITY: "0.6"
          REQUIRE_EARLY_HIT: "0"
          WATCH_EARLY_ONLY: "0"
          MIN_LIQ_USD: "2500"
          MIN_MCAP_USD: "5000"
          LIQ_MCAP_MIN: "0.15"
          COOLDOWN_SECONDS: "7200"
          WATCH_MIN_REALIZED_USD: "0"
          GMGN_LIMIT: "100"
          GMGN_COOLDOWN_PAD_SEC: "300"
          WATCHLIST_PATH: ${{ steps.wl.outputs.path }}
          STATE_PATH: state-arc.json
          PAPER_LOG_PATH: paper_log_arc.jsonl
          PAPER_BOOK_PATH: paper_book_arc.jsonl
          PAPER_SUMMARY_PATH: paper_summary_arc.md
        run: python3 bot.py --per-page 100

      - name: Upload paper artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-state-arc
          path: |
            state-arc.json
            paper_log_arc.jsonl
            paper_book_arc.jsonl
            paper_summary_arc.md
            live_state_arc.json
            live_book_arc.jsonl
          if-no-files-found: ignore
          retention-days: 14
