name: refresh-wallets

on:
  schedule:
    # Mon/Thu 10:00 JST = 01:00 UTC (cron-job.org kicks; save Nansen/FOMO credits)
    - cron: "0 1 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: refresh-wallets-rh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install gmgn-cli
        run: npm install -g gmgn-cli

      - name: Configure GMGN env (no echo)
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY_GHA || secrets.GMGN_API_KEY }}
          GMGN_DISABLED: "0"
        run: |
          mkdir -p "$HOME/.config/gmgn"
          python3 -c 'import os,pathlib; k=os.environ.get("GMGN_API_KEY",""); p=pathlib.Path.home()/".config/gmgn/.env"; p.write_text("GMGN_API_KEY="+k+"\n"); p.chmod(0o600); print("gmgn_dotenv=ok" if k else "gmgn_dotenv=missing")'

      - name: Collect — Nansen PnL leaderboard
        env:
          NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
          NANSEN_FOR_TRADES: "0"
          CHAIN: robinhood
          WATCHLIST_PATH: rh-wallets/wallets.jsonl
        run: python3 bot.py --refresh-wallets --pages 1

      - name: Collect — FOMO 7d board
        env:
          FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
          CHAIN: robinhood
          WATCHLIST_PATH: rh-wallets/wallets.jsonl
        run: python3 bot.py --refresh-fomo

      - name: Collect — KOL+FOMO vetted consistent only
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY_GHA || secrets.GMGN_API_KEY }}
          GMGN_DISABLED: "0"
          # Track endpoints are 429 even on GHA — reuse raw; spend the one good call on stats (WR).
          KOL_SKIP_FETCH: "1"
          KOL_LIMIT: "150"
          KOL_VET_CAP: "8"
          FOMO_VET_CAP: "5"
          KOL_MIN_TOKENS: "2"
          KOL_MIN_BUY_USD: "200"
          KOL_CHAINS: "robinhood,arc"
          REQUIRE_CONSISTENT_PNL: "1"
          WATCH_MIN_WINRATE: "0.45"
          WATCH_MIN_TRADES: "15"
          WATCH_MIN_AVG_PNL_PER_TRADE: "50"
          WATCH_MIN_REALIZED_HARD: "500"
          ALLOW_FOMO_WITHOUT_WR: "0"
        run: python3 scripts/harvest_kol_vetted.py
        continue-on-error: true


      # xbtscout burns GMGN before portfolio WR fills — keep off while track/stats are 429-prone
      - name: Collect — xbtscout smart tags (1 CA)
        if: ${{ false }}
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY_GHA || secrets.GMGN_API_KEY }}
          GMGN_DISABLED: "0"
          CHAIN: robinhood
          WATCHLIST_PATH: rh-wallets/wallets.jsonl
          XBTSCOUT_MAX_TOKENS: "2"
          XBTSCOUT_PRE_POST_ONLY: "1"
          XBTSCOUT_MIN_BUY_USD: "80"
          WATCH_MIN_REALIZED_HARD: "500"
        run: python3 bot.py --harvest-xbtscout
        continue-on-error: true

      - name: Refine — drop losers / banned labels
        env:
          CHAIN: robinhood
          WATCHLIST_PATH: rh-wallets/wallets.jsonl
          WATCH_MIN_REALIZED_USD: "0"
          WATCH_MIN_REALIZED_HARD: "500"
          DROP_WEAK_WALLETS: "1"
          REQUIRE_CONSISTENT_PNL: "1"
          ALLOW_FOMO_WITHOUT_WR: "0"
          WATCH_MIN_WINRATE: "0.45"
          WATCH_MIN_TRADES: "15"
          WATCH_MIN_TRADES_FOR_WR: "15"
          WATCH_MIN_AVG_PNL_PER_TRADE: "50"
        run: python3 bot.py --refine-wallets


      - name: Enrich — Scout TG deep harvest (scrape+resolve+rank)
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY_GHA || secrets.GMGN_API_KEY }}
          GMGN_DISABLED: "0"
          SCOUT_TG_ENABLED: "1"
          SCOUT_TG_PAGES: "80"
          SCOUT_TG_RESOLVE: "1"
          SCOUT_TG_VET_CAP: "0"
          SCOUT_TG_MAX_TOKENS: "60"
          SCOUT_TG_BS_PAGES: "30"
          SCOUT_TG_BLOCKSCOUT: "1"
          SCOUT_TG_BS_ALL: "0"
          SCOUT_TG_MULTI_UNION: "1"
          SCOUT_TG_SKIP_WELL_RESOLVED: "0.8"
          SCOUT_RANK_MERGE: "1"
          CHAIN: robinhood
          WATCHLIST_PATH: rh-wallets/wallets.jsonl
          REQUIRE_CONSISTENT_PNL: "1"
          WATCH_MIN_WINRATE: "0.45"
          WATCH_MIN_TRADES: "15"
          WATCH_MIN_AVG_PNL_PER_TRADE: "50"
          WATCH_MIN_REALIZED_HARD: "500"
        run: |
          python3 scripts/harvest_scout_telegram.py
          python3 scripts/rank_scout_wallets.py
        continue-on-error: true

      - name: Rank ALL wallets vs scout_tg seed + promote S/A tags
        env:
          WATCHLIST_PATH: rh-wallets/wallets.jsonl
          RANK_PROMOTE: "1"
          RANK_INCLUDE_ARC: "1"
          REQUIRE_CONSISTENT_PNL: "1"
          WATCH_MIN_WINRATE: "0.45"
          WATCH_MIN_TRADES: "15"
          WATCH_MIN_AVG_PNL_PER_TRADE: "50"
          WATCH_MIN_REALIZED_HARD: "500"
        run: python3 scripts/rank_all_wallets.py
        continue-on-error: true

      - name: On-chain expand from ranked S/A seeds (Blockscout)
        env:
          GMGN_DISABLED: "1"
          ONCHAIN_SEED_TIERS: "S,A"
          ONCHAIN_SEED_MAX: "25"
          ONCHAIN_TOKEN_MAX: "30"
          ONCHAIN_BS_PAGES: "5"
          ONCHAIN_MERGE_WATCH: "0"
          ONCHAIN_MIN_COSEED: "2"
          WATCHLIST_PATH: rh-wallets/wallets.jsonl
          RANKED_PATH: rh-wallets/wallets_ranked_all.jsonl
        run: python3 scripts/onchain_from_ranked.py
        continue-on-error: true

      - name: Commit watchlist if changed
        continue-on-error: true
        run: |
          git config user.name "meme-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rh-wallets/wallets.jsonl rh-wallets/wallets_scout_ranked.jsonl rh-wallets/wallets_ranked_all.jsonl rh-wallets/wallets_onchain.jsonl rh-wallets/summary_scout.md rh-wallets/summary_scout_resolve.md rh-wallets/summary_rank_all.md rh-wallets/summary_onchain_ranked.md rh-wallets/raw/ arc-wallets/wallets.jsonl arc-wallets/wallets_quality.jsonl arc-wallets/raw/ fomo-wallets/ xbtscout/ scripts/harvest_kol_vetted.py scripts/harvest_scout_telegram.py scripts/rank_scout_wallets.py scripts/rank_all_wallets.py scripts/onchain_from_ranked.py || true
          if git diff --cached --quiet; then
            echo "no wallet changes"
          else
            git commit -m "chore: refresh+refine smart wallets"
            if ! git pull --rebase origin main; then
              echo "rebase conflict — prefer GHA wallet/raw artifacts"
              for f in rh-wallets/wallets.jsonl rh-wallets/wallets_scout_ranked.jsonl rh-wallets/wallets_ranked_all.jsonl rh-wallets/wallets_onchain.jsonl rh-wallets/summary_scout.md rh-wallets/summary_scout_resolve.md rh-wallets/summary_rank_all.md rh-wallets/summary_onchain_ranked.md; do
                if [ -f "$f" ] && git status --porcelain "$f" | grep -q .; then
                  git checkout --theirs -- "$f" || true
                  git add "$f" || true
                fi
              done
              git add rh-wallets/raw/ || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            git push || git push --rebase origin main || true
          fi

      - name: Upload wallets artifact
        uses: actions/upload-artifact@v4
        with:
          name: rh-wallets-jsonl
          path: |
            rh-wallets/wallets.jsonl
            rh-wallets/wallets_scout_ranked.jsonl
            rh-wallets/wallets_ranked_all.jsonl
            rh-wallets/wallets_onchain.jsonl
            rh-wallets/summary_scout.md
            rh-wallets/summary_scout_resolve.md
            rh-wallets/summary_rank_all.md
            rh-wallets/summary_onchain_ranked.md
            rh-wallets/raw/scout_tg_*.jsonl
            fomo-wallets/
          retention-days: 30
