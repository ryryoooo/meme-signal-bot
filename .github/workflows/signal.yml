name: meme-signal

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install gmgn-cli
        run: npm install -g gmgn-cli

      - name: Configure GMGN env (no echo)
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        run: |
          mkdir -p "$HOME/.config/gmgn"
          python3 -c 'import os,pathlib; k=os.environ.get("GMGN_API_KEY",""); p=pathlib.Path.home()/".config/gmgn/.env"; p.write_text("GMGN_API_KEY="+k+"\n"); p.chmod(0o600); print("gmgn_dotenv=ok" if k else "gmgn_dotenv=missing")'

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: |
            state.json
            paper_log.jsonl
            paper_book.jsonl
            paper_summary.md
          key: meme-signal-state-v4
          restore-keys: |
            meme-signal-state-

      - name: Run once (signals + paper marks)
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PAPER_WEBHOOK_URL: ${{ secrets.DISCORD_PAPER_WEBHOOK_URL }}
          NANSEN_FOR_TRADES: "0"
          LIVE_TRADING: "0"
          ALLOW_GMGN_CLUSTER: "0"
          PAPER_BANKROLL_USD: "300"
          CHAIN: robinhood
          WINDOW_SECONDS: "900"
          MIN_WALLETS: "2"
          MIN_TRADE_USD: "50"
          COOLDOWN_SECONDS: "7200"
          WATCH_MIN_REALIZED_USD: "0"
          WATCH_MIN_WINRATE: "0.40"
          WATCH_MIN_TRADES_FOR_WR: "10"
          GMGN_LIMIT: "100"
          FOMO_ENABLED: "1"
          FOMO_POLL_SECONDS: "1500"
          FOMO_ALERT_LIMIT: "80"
          FOMO_HOLDERS: "1"
          FOMO_HOLDERS_INTERVAL: "14400"
          FOMO_WATCH_PATH: fomo-wallets/wallets_evm.jsonl
          WATCHLIST_PATH: rh-wallets/wallets.jsonl
          STATE_PATH: state.json
          PAPER_LOG_PATH: paper_log.jsonl
          PAPER_BOOK_PATH: paper_book.jsonl
          PAPER_SUMMARY_PATH: paper_summary.md
        run: python3 bot.py --per-page 100

      - name: Upload paper artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-state
          path: |
            state.json
            paper_log.jsonl
            paper_book.jsonl
            paper_summary.md
          if-no-files-found: ignore
          retention-days: 14
