name: meme-signal

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: |
            state.json
            paper_log.jsonl
          key: meme-signal-state-v2
          restore-keys: |
            meme-signal-state-

      - name: Run once
        env:
          NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHAIN: robinhood
          WINDOW_SECONDS: "900"
          MIN_WALLETS: "2"
          MIN_TRADE_USD: "50"
          COOLDOWN_SECONDS: "21600"
          WATCH_MIN_REALIZED_USD: "0"
          WATCHLIST_PATH: rh-wallets/wallets.jsonl
          STATE_PATH: state.json
          PAPER_LOG_PATH: paper_log.jsonl
        run: python3 bot.py --pages 2 --per-page 100

      # cache save happens automatically at end of job for actions/cache
