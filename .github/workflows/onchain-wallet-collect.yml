name: onchain-wallet-collect

on:
  schedule:
    # Every 6h UTC; cron-job.org also dispatches (offset :15) because GH cron often skips.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: onchain-wallet-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install gmgn-cli
        run: npm install -g gmgn-cli

      - name: Collect on-chain wallets (Arc + RH, skip GMGN)
        env:
          ARC_INLINE_ACTIVITY_MAX: "400"
          RH_ONCHAIN_MERGE_MAX: "0"
          RH_ONCHAIN_MERGE_TO_WATCH: "0"
          ONCHAIN_KEEPER_FLOOR: "0.01"
          RH_ONCHAIN_FLOOR: "500"
          RH_ONCHAIN_VET_FLOOR: "500"
        run: python3 onchain_wallet_collect.py --chain both --skip-gmgn

      - name: Vet top RH onchain (low GMGN call-cap; no merge by default)
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          RH_VET_MAX_CALLS: "5"
          RH_ONCHAIN_VET_FLOOR: "500"
          RH_VET_MERGE: "0"
        run: |
          mkdir -p "$HOME/.config/gmgn"
          python3 -c 'import os,pathlib; k=os.environ.get("GMGN_API_KEY",""); p=pathlib.Path.home()/".config/gmgn/.env"; p.write_text("GMGN_API_KEY="+k+"\n"); p.chmod(0o600)'
          python3 vet_rh_onchain.py || true

      - name: Commit wallet jsonl if changed
        run: |
          git config user.name "meme-signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            arc-wallets/wallets.jsonl \
            arc-wallets/wallets_quality.jsonl \
            arc-wallets/summary.md \
            arc-wallets/summary_quality.md \
            rh-wallets/wallets.jsonl \
            rh-wallets/wallets_onchain.jsonl \
            rh-wallets/summary.md \
            onchain_collect_summary.md \
            || true
          if git diff --cached --quiet; then
            echo "no wallet changes"
          else
            git commit -m "chore: on-chain wallet collect (Arc+RH)"
            git push
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onchain-wallets
          path: |
            arc-wallets/wallets.jsonl
            arc-wallets/wallets_quality.jsonl
            rh-wallets/wallets.jsonl
            rh-wallets/wallets_onchain.jsonl
            onchain_collect_summary.md
          retention-days: 14
